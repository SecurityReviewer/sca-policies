  - id: 61122
    name: "Ensure Outlook blocks external content in HTML mail"
    description: "BlockExtContent must be 1."
    rationale: "External images and content are used for tracking and to confirm that a mailbox is live."
    remediation: "Block external content in HTML e-mail in the Outlook Trust Center."
    compliance:
      gdpr: ["IV_32.1.b"]
