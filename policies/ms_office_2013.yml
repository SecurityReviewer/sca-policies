# Security Configuration Assessment
# Microsoft Office 2013 hardening (Cyber Reviewer)
#
# Registry checks of the machine-wide Office policy keys (HKLM\SOFTWARE\Policies\Microsoft\Office\15.0\). A missing key means the
# setting is not enforced by policy and the check fails. This is an original policy based on the Microsoft Office
# security baseline guidance; it is not a CIS Benchmark.

policy:
  id: "ms_office_2013"
  file: "ms_office_2013.yml"
  name: "Microsoft Office 2013 hardening (macros, Protected View, DDE, ActiveX, updates)"
  description: "Machine-wide policy checks for Word, Excel, PowerPoint and Outlook 2013."
  references:
    - https://learn.microsoft.com/en-us/deployoffice/security/

requirements:
  name: "Check that Microsoft Office 2013 is installed"
  description: "Office 15.0 (MSI or Click-to-Run, 32 or 64 bit). File rules cover installs that a 32-bit agent cannot see in the 64-bit registry view."
  condition: any
  rules:
    - 'c:powershell -NoProfile -Command "if ((reg query ''HKLM\SOFTWARE\Microsoft\Office\15.0\Common\InstallRoot'' /reg:64 2>&1) -match ''InstallRoot'') {''INSTALLED''} elseif ((reg query ''HKLM\SOFTWARE\Microsoft\Office\15.0\Common\InstallRoot'' /reg:32 2>&1) -match ''InstallRoot'') {''INSTALLED''} else {''NO''}" -> r:^INSTALLED'

checks:
  - id: 61100
    name: "Ensure Word macros are disabled or limited to digitally signed ones"
    description: "VBAWarnings must be 3 (disable all except digitally signed macros) or 4 (disable all without notification) via policy."
    rationale: "Malicious macros are the most common delivery vector of ransomware and infostealers through Office documents."
    remediation: "Set 'VBA Macro Notification Settings' to 'Disable all except digitally signed macros' or 'Disable all without notification' (Microsoft Word 2013 > Application Settings > Security > Trust Center)."
    compliance:
      gdpr: ["IV_32.1.b"]
      iso_27001: ["A.8.7", "A.8.9"]
      nis2: ["21.2.e"]
    references:
      - https://learn.microsoft.com/en-us/deployoffice/security/
    condition: all
    rules:
      - 'c:powershell -NoProfile -Command "$o = reg query ''HKLM\SOFTWARE\Policies\Microsoft\Office\15.0\Word\Security'' /v VBAWarnings /reg:64 2>&1; if ($o -match ''REG_DWORD\s+0x([0-9a-fA-F]+)'') {[Convert]::ToInt32($matches[1],16)} else {''MISSING''}" -> r:^3|^4'

  - id: 61101
    name: "Ensure Word blocks macros from running in files from the Internet"
    description: "blockcontentexecutionfrominternet must be 1 so macros in files carrying the Mark of the Web are blocked."
    rationale: "Documents downloaded from the Internet or received by e-mail carry the Mark of the Web; blocking macros there removes the main phishing path."
    remediation: "Enable 'Block macros from running in Office files from the Internet' for Word."
    compliance:
      gdpr: ["IV_32.1.b"]
      iso_27001: ["A.8.7", "A.8.9"]
      nis2: ["21.2.e"]
    references:
      - https://learn.microsoft.com/en-us/deployoffice/security/
    condition: all
    rules:
      - 'c:powershell -NoProfile -Command "$o = reg query ''HKLM\SOFTWARE\Policies\Microsoft\Office\15.0\Word\Security'' /v blockcontentexecutionfrominternet /reg:64 2>&1; if ($o -match ''REG_DWORD\s+0x([0-9a-fA-F]+)'') {[Convert]::ToInt32($matches[1],16)} else {''MISSING''}" -> r:^1'

  - id: 61102
    name: "Ensure Word does not trust access to the VBA object model"
    description: "AccessVBOM must be 0."
    rationale: "Trusted programmatic access to the VBA project lets a macro create or modify other macros, enabling self-replicating malicious code."
    remediation: "Disable 'Trust access to the VBA project object model' for Word."
    compliance:
      gdpr: ["IV_32.1.b"]
      iso_27001: ["A.8.7", "A.8.9"]
      nis2: ["21.2.e"]
    references:
      - https://learn.microsoft.com/en-us/deployoffice/security/
    condition: all
    rules:
      - 'c:powershell -NoProfile -Command "$o = reg query ''HKLM\SOFTWARE\Policies\Microsoft\Office\15.0\Word\Security'' /v AccessVBOM /reg:64 2>&1; if ($o -match ''REG_DWORD\s+0x([0-9a-fA-F]+)'') {[Convert]::ToInt32($matches[1],16)} else {''MISSING''}" -> r:^0'

  - id: 61103
    name: "Ensure Protected View is not disabled for files from the Internet in Word"
    description: "DisableInternetFilesInPV must be 0 so the document opens in Protected View."
    rationale: "Protected View opens untrusted documents in a sandbox where active content does not run."
    remediation: "Do not enable the 'Turn off Protected View for files from the Internet' setting in Word."
    compliance:
      gdpr: ["IV_32.1.b"]
      iso_27001: ["A.8.7", "A.8.9"]
      nis2: ["21.2.e"]
    references:
      - https://learn.microsoft.com/en-us/deployoffice/security/
    condition: all
    rules:
      - 'c:powershell -NoProfile -Command "$o = reg query ''HKLM\SOFTWARE\Policies\Microsoft\Office\15.0\Word\Security\ProtectedView'' /v DisableInternetFilesInPV /reg:64 2>&1; if ($o -match ''REG_DWORD\s+0x([0-9a-fA-F]+)'') {[Convert]::ToInt32($matches[1],16)} else {''MISSING''}" -> r:^0'

