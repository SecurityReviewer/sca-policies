      - 'c:powershell -NoProfile -Command "$o = reg query ''HKLM\SOFTWARE\Policies\Microsoft\Office\15.0\Outlook\Security'' /v PromptOOMSend /reg:64 2>&1; if ($o -match ''REG_DWORD\s+0x([0-9a-fA-F]+)'') {[Convert]::ToInt32($matches[1],16)} else {''MISSING''}" -> r:^0'

  - id: 61125
    name: "Ensure automatic Office updates are enabled"
    description: "EnableAutomaticUpdates must be 1."
    rationale: "Unpatched Office installations are exploited through known vulnerabilities."
    remediation: "Enable 'Enable Automatic Updates' in the Office Update policy."
    compliance:
      gdpr: ["IV_32.1.b"]
      iso_27001: ["A.8.7", "A.8.9"]
      nis2: ["21.2.e"]
    references:
      - https://learn.microsoft.com/en-us/deployoffice/security/
    condition: all
    rules:
      - 'c:powershell -NoProfile -Command "$o = reg query ''HKLM\SOFTWARE\Policies\Microsoft\Office\15.0\Common\OfficeUpdate'' /v EnableAutomaticUpdates /reg:64 2>&1; if ($o -match ''REG_DWORD\s+0x([0-9a-fA-F]+)'') {[Convert]::ToInt32($matches[1],16)} else {''MISSING''}" -> r:^1'
