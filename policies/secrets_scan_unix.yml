# Security Configuration Assessment
# Secrets detection on Linux / macOS hosts (Cyber Reviewer)
#
# TruffleHog (github.com/trufflesecurity/trufflehog, AGPL-3.0, not bundled) is the detection engine; the built-in custom scanner
# is used only on platforms TruffleHog does not support. The scan is run periodically by a wodle command (see
# wodles/secrets-scan/README.md); each check below reads its results (/var/ossec/var/secrets-scan/results.json) and reports
# Passed/Failed per category. Raw secret values are never stored or sent; file names and line numbers are available on the host
# with "secrets_scan.py report". TruffleHog live verification is disabled by default.

policy:
  id: "secrets_scan_unix"
  file: "secrets_scan_unix.yml"
  name: "Secrets detection in files and git repositories (Linux/macOS)"
  description: "Detects private keys, cloud credentials, service tokens and hard-coded passwords stored in files and git history, with TruffleHog (custom scanner only where TruffleHog is not supported)."
  references:
    - https://github.com/trufflesecurity/trufflehog
    - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html

requirements:
  name: "Check that the secrets scanner is installed"
  description: "The scanner is expected at /var/ossec/wodles/secrets-scan/secrets_scan.py."
  condition: all
  rules:
    - 'f:/var/ossec/wodles/secrets-scan/secrets_scan.py'

checks:
  - id: 62001
    name: "Ensure no private keys are stored in files"
    description: "Private keys (PEM, OpenSSH, PGP) must not be left in home directories, application folders or repositories."
    rationale: "A private key lying in a file gives anyone who can read it the identity of its owner (SSH access, TLS impersonation, code signing)."
    remediation: "Remove the key from the file system and from git history, revoke and rotate it, and keep keys in an HSM, a secrets vault or an agent."
    compliance:
      gdpr: ["IV_32.1.b"]
      iso_27001: ["A.8.24", "A.5.17"]
      nis2: ["21.2.h", "21.2.i"]
    references:
      - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    condition: all
    rules:
      - 'c:python3 /var/ossec/wodles/secrets-scan/secrets_scan.py check private_keys -> r:^PASS'

  - id: 62002
    name: "Ensure no cloud provider credentials are stored in files"
    description: "AWS, Google Cloud, Azure and other cloud credentials must not be present in files or repositories."
    rationale: "Leaked cloud keys are used within minutes for resource abuse, data theft and lateral movement in the cloud tenant."
    remediation: "Revoke and rotate the credentials, remove them from files and git history, and use short-lived roles/workload identity instead of static keys."
    compliance:
      gdpr: ["IV_32.1.b"]
      iso_27001: ["A.5.17", "A.8.24", "A.5.23"]
      nis2: ["21.2.i", "21.2.h"]
    references:
      - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    condition: all
    rules:
      - 'c:python3 /var/ossec/wodles/secrets-scan/secrets_scan.py check cloud_credentials -> r:^PASS'

  - id: 62003
    name: "Ensure no service API tokens are stored in files"
    description: "Access tokens of third-party services (source hosting, chat, payments, mail, package registries) must not be present in files or repositories."
    rationale: "Service tokens grant access to code, customer data or payment functions and are routinely harvested from repositories and backups."
    remediation: "Revoke and rotate the token, remove it from files and git history, and load it from a secrets manager or the environment at runtime."
    compliance:
      gdpr: ["IV_32.1.b"]
      iso_27001: ["A.5.17", "A.8.28"]
      nis2: ["21.2.i", "21.2.e"]
    references:
      - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    condition: all
    rules:
      - 'c:python3 /var/ossec/wodles/secrets-scan/secrets_scan.py check service_tokens -> r:^PASS'

  - id: 62004
    name: "Ensure no passwords are embedded in configuration files, scripts or connection strings"
    description: "Passwords and secrets written in clear text in configuration files, scripts, .env files and connection strings must not be present."
    rationale: "Clear-text credentials are readable by any user or process with file access and end up in backups, images and repositories."
    remediation: "Move the credentials to a secrets manager or protected store, rotate the exposed values and purge them from history."
    compliance:
      gdpr: ["IV_32.1.b"]
      iso_27001: ["A.5.17", "A.8.28", "A.8.4"]
      nis2: ["21.2.i", "21.2.e"]
    references:
      - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    condition: all
    rules:
      - 'c:python3 /var/ossec/wodles/secrets-scan/secrets_scan.py check hardcoded_credentials -> r:^PASS'

  - id: 62005
    name: "Ensure the secrets scan runs and completes"
    description: "The secrets scan must be scheduled, use a supported engine, finish without errors within the time budget and be recent."
    rationale: "A scan that never ran, timed out or has no engine gives a false sense of security: the other checks would pass without any evidence."
    remediation: "Install the TruffleHog binary (supported platforms), check the wodle-command schedule and review the errors reported by 'secrets_scan report'."
    compliance:
      gdpr: ["IV_32.1.b"]
      iso_27001: ["A.8.8", "A.8.16"]
      nis2: ["21.2.f", "21.2.e"]
    references:
      - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    condition: all
    rules:
      - 'c:python3 /var/ossec/wodles/secrets-scan/secrets_scan.py check scan_health -> r:^PASS'
